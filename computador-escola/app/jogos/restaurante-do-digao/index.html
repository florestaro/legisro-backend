<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <!-- Só esta página (o quadro do jogo) libera o WebAssembly do Ruffle; o resto do programa continua com a regra mais fechada. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' data: blob:; connect-src 'self' data: blob:; font-src 'self' data:; worker-src 'self' blob:">
  <title>Restaurante do Digão</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #1b1b1b; }
    #jogo { position: absolute; inset: 0; }
    #jogo ruffle-player { display: block; width: 100%; height: 100%; }
    #aviso { position: absolute; inset: 0; display: grid; place-content: center; gap: 8px; text-align: center; color: #fff; font: 600 18px "Segoe UI", system-ui, sans-serif; background: #1b1b1b; }
    #aviso small { font-weight: 400; font-size: 14px; opacity: .8; }
    #aviso[hidden] { display: none; }
  </style>
</head>
<body>
  <div id="jogo" aria-label="Restaurante do Digão"></div>
  <div id="aviso" role="status"><span>🍔 Abrindo o Restaurante do Digão...</span><small>Na primeira vez pode demorar alguns segundos.</small></div>
  <script src="ruffle/ruffle.js"></script>
  <script src="jogo.js"></script>
</body>
</html>
