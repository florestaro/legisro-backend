name: Computador Escola – instalador Windows

on:
  workflow_dispatch:
  push:
    paths:
      - 'computador-escola/**'
      - '.github/workflows/computador-escola.yml'

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: computador-escola
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: computador-escola/package-lock.json
      - run: npm ci
      - run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: computador-escola-windows
          path: computador-escola/dist/*.exe
          retention-days: 30
