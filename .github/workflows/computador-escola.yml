name: Computador Escola – instalador Windows

on:
  workflow_dispatch:
  push:
    paths:
      - 'computador-escola/**'
      - '.github/workflows/computador-escola.yml'

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write   # para publicar os instaladores na página de downloads (Releases)
    defaults:
      run:
        working-directory: computador-escola
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: computador-escola/package-lock.json
      - run: npm ci
      - run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: computador-escola-windows
          path: computador-escola/dist/*.exe
          retention-days: 30
      # Página de download com link fixo, sem precisar de login no GitHub:
      # https://github.com/florestaro/legisro-backend/releases/tag/computador-escola
      - name: Publicar na página de downloads
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete computador-escola --yes --cleanup-tag || true
          gh release create computador-escola \
            dist/Instalar-Computador-Escola.exe dist/Computador-Escola-Portatil.exe \
            --target "${{ github.sha }}" --latest=false \
            --title "Computador Escola — versão mais recente" \
            --notes "Instalar-Computador-Escola.exe: baixe, dê dois cliques e pronto (não precisa de senha de administrador; cria o ícone na área de trabalho e abre sozinho). Computador-Escola-Portatil.exe: roda direto do pen drive, sem instalar. Precisa de Windows 10 ou 11 de 64 bits. Versão ${{ github.sha }}."

